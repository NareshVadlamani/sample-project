[env:esp32s3_setup]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino

; Force the correct port
upload_port = /dev/ttyACM0
monitor_port = /dev/ttyACM0
; upload_port = /dev/ttyACM*
; monitor_port = /dev/ttyACM*
monitor_speed = 115200

; --- FORCE SERIAL MONITOR DTR/RTS SIGNALS ---
monitor_dtr = 0
monitor_rts = 0

; --- Enable OPI / QSPI PSRAM for ESP32-S3 ---
board_build.arduino.memory_type = qio_opi
board_build.f_flash = 80000000L

; Configures native USB CDC for ESP32-S3
build_flags = 
    -DARDUINO_USB_CDC_ON_BOOT=0
    -DARDUINO_USB_MODE=0

; Installs the correct ESP32 servo library automatically
lib_deps = 
    madhephaestus/ESP32Servo @ ^3.0.5
    adafruit/Adafruit Fingerprint Sensor Library @ ^2.1.3
    bblanchon/ArduinoJson @ ^7.0.0